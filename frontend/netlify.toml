[build]
  command = "pnpm build"
  publish = "dist"

# Превью-стенд: закрыт от поисковиков. На боевом домене этот сайт не используется,
# а noindex для него — требование (иначе *.netlify.app попадёт в индекс).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=6144"
  NUXT_PUBLIC_STRAPI_URL = "https://u34165-8120.by5010.ihb.by"
  NUXT_STRAPI_URL = "https://u34165-8120.by5010.ihb.by"
  SITE_URL = "https://agro-proj.netlify.app"
  # Стенд закрыт от индексации (см. nuxt.config.ts: NUXT_PUBLIC_NOINDEX)
  NUXT_PUBLIC_NOINDEX = "1"
